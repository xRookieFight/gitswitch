name: Bug report
description: Something in gitswitch does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste a token**, even an expired one.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. gitswitch add --name work ...
        2. gitswitch switch work
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gitswitch doctor`
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gitswitch version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      placeholder: GNOME Terminal, iTerm2, Windows Terminal, ...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release
          required: true
        - label: My report contains no tokens or other credentials
          required: true
